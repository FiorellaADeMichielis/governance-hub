<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Governance Hub</title>
    <style>
      /* Soporte de esquema de color nativo del navegador */
      .dark {
        color-scheme: dark;
      }

      /* Desactivar toggle nativo de visibilidad de contraseñas de navegadores (Edge / Windows) */
      input::-ms-reveal,
      input::-ms-clear {
        display: none !important;
      }

      /* Autocompletado y hover de autocompletado en modo oscuro */
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover,
      .dark input:-webkit-autofill:focus,
      .dark input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #292524 inset !important;
        -webkit-text-fill-color: #f5f5f4 !important;
        caret-color: #f5f5f4 !important;
        transition: background-color 5000s ease-in-out 0s;
      }

      /* Checkbox con checkmark SVG cuando se selecciona */
      input[type="checkbox"]:checked {
        background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        background-size: 100% 100%;
      }

      /* Flecha de dropdown (select) con separación estética y notoria del borde */
      select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2378716c' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.85rem center;
        background-repeat: no-repeat;
        background-size: 1.15em 1.15em;
        padding-right: 2.5rem !important;
      }

      .dark select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23a8a29e' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
